# Alembic configuration for CareerGuide AI.
#
# Migrations are how an existing database changes shape. The app itself does not
# need Alembic to run: on a fresh database it still creates its tables on first
# boot (see `app/main.py` and `scripts/db_init.py`). Alembic is what you run
# afterwards, against a database that already holds somebody's data.
#
# `sqlalchemy.url` is deliberately absent. `migrations/env.py` fills it in from
# `DATABASE_URL` / `.env`, the same source the app uses, so a migration can never
# be pointed at a database the app is not talking to.
#
#   .venv\Scripts\alembic.exe upgrade head      # apply
#   .venv\Scripts\alembic.exe downgrade -1      # undo the last step
#   .venv\Scripts\alembic.exe current           # what this database thinks it is
#
# Run every command from `backend/`.

[meta]
main_loggers = generic,careerguide

[alembic]
script_location = migrations
# Readable, sortable revision ids: date plus a sequence number.
file_template = %%(year)d%%(month).2d%%(day).2d-%%(rev)s
truncate_slug_length = 40
# Versioned tables are created here, not in the application schema.
version_table = alembic_version
prepend_sys_path = .

# Keeps `alembic revision --autogenerate` honest about the app's own models.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic,careerguide

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# The app logs at INFO under this name; Alembic's fileConfig replaces the running
# config, so keep it quiet here and let the application decide its own level.
[logger_careerguide]
level = WARNING
handlers =
qualname = careerguide

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
